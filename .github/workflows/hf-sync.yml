name: Sync to Hugging Face Space

# Mirrors this branch to a Hugging Face Space on every push.
# Requires repo secrets:
#   HF_TOKEN  - a Hugging Face access token with write scope
#   HF_SPACE  - the target Space, e.g. "your-user/wasla-recommender"

on:
  push:
    branches: [Ai-integration, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE secret not set; skipping sync."
            exit 0
          fi
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" \
            "HEAD:refs/heads/main"
