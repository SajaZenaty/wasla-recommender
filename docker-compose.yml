services:
  recommender:
    build: .
    image: wasla-recommender:latest
    container_name: wasla-recommender
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      INDEX_SNAPSHOT_PATH: /data/index_snapshot.pkl
    volumes:
      - recommender_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  recommender_data:
